<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/buttons.js') }}"></script> -->
    <link rel="stylesheet" href="../../styles/style.css">
    <script src="../js/main.js"></script>

    <!-- <script src="../js/buttons.js"></script> -->
    
    <title>LogHAnalyzer</title>

</head>
<body>
   <div class="content">

        <div class="mount"> 
                <h3>Mount Image</h3>
                <button id="open">Mount</button>
                <button id="unmount">Unmount</button>
        </div>

        <br>

        <div class="generation">
                <h3>Generate Plot and Table</h3>
                <button id="plot">Generate</button>
                <button id="toggleConfig">Show/Hide Config</button>
        </div>

    
        <div class="config" id="config">
            <h3>Configuration</h3>
            <label>From:</label>
            <input type="datetime-local" id="from">
            <label>To:</label>
            <input type="datetime-local" id="to">
            <br>
            <input type="checkbox" id="filterBox">
            <label for="filterBox">Only Show Sensors</label>
            <br>
            <input type="checkbox" id="filterMoreBox" disabled="true">
            <label for="filterMoreBox">Filter Out Battery/Voltage/Sun/Backup etc.</label>
            <br>
            <input type="checkbox" id="zoomBox">
            <label for="zoomBox">Lock Y-Axis Zoom</label>

            <br>

            Order table by...

            <label>
                <input type="radio" name="mode" value="1" checked>
                Timestamp
            </label>

            <label>
                <input type="radio" name="mode" value="2">
                Sensor
            </label>

            <label>
                <input type="radio" name="mode" value="3">
                Info
            </label>

            <label>
                <input type="radio" name="mode" value="4">
                State
            </label>

            <label>
                <input type="radio" name="mode" value="5">
                Deviceclass
            </label>
        </div>
        

        <div id="chart-container">
            <canvas id="numberLine"></canvas>
        </div>

        <br><br>

        <div class="tableContainer" id="tableContainer">
            <table id="queryTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>EntityID</th>
                        <th>Info</th>
                        <th>State</th>
                        <th>Deviceclass</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div> 
    </div>
    
    <div class="scripts">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
        <script src="../js/renderer.js"></script>
    </div>

</body>
</html>
