- id: '1764179193065'
  alias: LR Lights
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.lr_motion_sensor_occupancy
    from:
    - 'off'
    to:
    - 'on'
  conditions:
  - condition: sun
    before: sunrise
    after: sunset
  actions:
  - type: turn_on
    device_id: e57c46951b3d3eefbd554c45ee5fd7ee
    entity_id: 432a4dd239460a506a90f8b3b821e0f7
    domain: light
    flash: short
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.lr_motion_sensor_occupancy
      from:
      - 'on'
      to:
      - 'off'
  - type: turn_off
    device_id: e57c46951b3d3eefbd554c45ee5fd7ee
    entity_id: 432a4dd239460a506a90f8b3b821e0f7
    domain: light
  mode: single
