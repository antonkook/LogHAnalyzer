{% extends 'base.html' %}

{% block head %}
    <title>LogHAnalyzer</title>
{% endblock %}

{% block body %}
    <div class="content">
        <h3>Select image</h3>
        <!-- <p>Example locations of logs: hassos-data/logs/ | /var/log/ | homeassistant/zigbee2mqtt/log/ | homeassistant/</p> -->
        <form action="/uploadimage" method="post" enctype="multipart/form-data">
            <input type="file" name="image" value="Upload hassos-data image">
            <input type="submit" value="Upload">
            <input type="button" value="Clear" onclick="window.location.href='/clear'">
        </form>

        <br>
    </div>
{% endblock %}
