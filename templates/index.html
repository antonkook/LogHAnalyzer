{% extends 'base.html' %}

{% block head %}
    <title>LogHAnalyzer</title>
{% endblock %}

{% block body %}
    <div class="content">
        <!-- <h1>LogHAnalyzer</h1> -->
        <h2>Upload Logfiles</h2>
        <h3>Select system logfiles (hassos-data/logs)</h3>
        <form action="/" method="post" enctype="multipart/form-data">
            <input type="file" webkitdirectory directory multiple name="logfiles">
            <input type="submit" value="Upload">
        </form>

        <table>
            <tr>
                <th>Content</th>
                <!-- <th>Time / Date</th>
                <th>Filename</th>
                <th>Processed</th>
                <th>Path</th> -->
            </tr>
            <!-- TODO find out how to go over entries of a logfile instead -->
            {% for log_file in log_files %} 
                <tr>
                    <!-- TODO each line (entry) -->
                    <td></td>
                    <!-- <td>{{ log_file.date_uploaded }}</td>
                    <td>{{ log_file.filename }}</td>
                    <td>{{ 'Yes' if log_file.processed else 'No' }}</td>
                    <td>{{ log_file.filepath }}</td> -->
                </tr>
            {% endfor %}
        </table>
    </div>
{% endblock %}
